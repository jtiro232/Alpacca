name: test

on:
  push:
    branches: ["**"]
  pull_request:

env:
  PYTHONUTF8: "1"   # Windows runners default to cp1252 pipes

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, ${{ matrix.deps }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        deps: [stdlib, numpy]
        include:
          - os: ubuntu-latest
            deps: kernels
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NumPy (accelerated variant only)
        if: matrix.deps == 'numpy'
        run: python -m pip install numpy

      - name: Install NumPy + pinned Numba (kernels variant)
        if: matrix.deps == 'kernels'
        run: python -m pip install numpy "numba==0.65.1"

      - name: Offline smoke suite (mock registry + tiny models)
        run: python tests/smoke.py

      # tests/bench.py and tests/make_bench_model.py are not part of the smoke
      # suite, so nothing noticed when the bench fixture could only write
      # llama-architecture files. Run both shapes on a tiny synthetic model.
      - name: Bench harness (synthetic llama + gemma3)
        shell: bash   # the Windows runner defaults to PowerShell, where "\" is not a line continuation
        run: |
          python tests/make_bench_model.py bench-llama.gguf Q4_0 \
            --vocab 2000 --embd 128 --ff 256 --layers 2 --heads 4
          python tests/bench.py --model bench-llama.gguf --prefill 32 --decode 8
          python tests/make_bench_model.py bench-gemma3.gguf Q4_0 --arch gemma3 \
            --vocab 2000 --embd 128 --ff 256 --layers 2 --heads 4 --kv 1 \
            --head-dim 32
          python tests/bench.py --model bench-gemma3.gguf --prefill 32 --decode 8

  real-model:
    # True correctness gate: real trained weights through the whole engine.
    name: real model (stories15M from Hugging Face)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install numpy

      - name: Pull and generate
        run: python tests/real_model_test.py
